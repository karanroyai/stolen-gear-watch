# Copy to config/settings.yaml. This file contains no personal data and is
# safe to commit/share - the actual stolen item lives in watched_items.yaml.

db_path: data/stolen_gear_watch.db
log_level: INFO       # DEBUG | INFO | WARNING | ERROR
log_format: json       # json | text

# Minimum fuzzy text-match score (0-1) before a listing counts as a text
# match. Serial-number matches always count regardless of this threshold.
match_confidence_threshold: 0.6

# Sent as part of the User-Agent on every request, and used as the
# contact point site operators can reach if there's an issue - good
# scraping citizenship. Falls back to SCRAPER_CONTACT_EMAIL in .env if unset.
scraper_contact_email: null

scrapers:
  willhaben:
    enabled: false   # robots.txt confirmed disallows this - see scrapers/willhaben.py docstring
    rate_limit_seconds: 5
    max_pages: 3
    # respect_robots_txt defaults to true and isn't set here on purpose - the
    # shipped example always honors robots.txt. If you've made an informed,
    # personal decision to scrape Willhaben anyway (their robots.txt
    # explicitly says not to - this is on you, not something this project
    # endorses), set both of these in your own config/settings.yaml instead:
    #   enabled: true
    #   respect_robots_txt: false
  kleinanzeigen:
    enabled: true
    rate_limit_seconds: 5
    max_pages: 3
  limundo:
    enabled: false   # experimental - see scrapers/limundo.py docstring
    rate_limit_seconds: 5
    max_pages: 3
  kupujemprodajem:
    enabled: true
    rate_limit_seconds: 5
    max_pages: 3
  ebay:
    enabled: false   # verified live - needs your own EBAY_CLIENT_ID/SECRET in .env, see scrapers/ebay.py docstring
    rate_limit_seconds: 2   # official API, not a scraped page - a lighter delay is fine
    max_pages: 3
  publi24:
    enabled: true   # Romania - verified live, see scrapers/publi24.py docstring
    rate_limit_seconds: 5
    max_pages: 3
  bazar_bg:
    enabled: true   # Bulgaria - verified live, see scrapers/bazar_bg.py docstring
    rate_limit_seconds: 5
    max_pages: 3
  pazar3_mk:
    enabled: true   # North Macedonia - verified live, see scrapers/pazar3_mk.py docstring
    rate_limit_seconds: 5
    max_pages: 3
  merrjep_al:
    enabled: true   # Albania - verified live, see scrapers/merrjep_al.py docstring
    rate_limit_seconds: 5
    max_pages: 3

reverse_image:
  # manual (default, no API key needed) | google_vision | tineye
  backend: manual
  min_confidence: 0.75

ocr:
  # Independent of reverse_image.backend above - different problem (read a
  # serial out of a photo, not "does this image exist elsewhere on the web").
  # none (default, disabled) | google_vision | easyocr (free, local, no
  # account - see matching/ocr.py for the tradeoffs)
  backend: none

web_search:
  # General keyword web search (e.g. "Fujifilm X100VI") across the whole
  # web, filtered for retailer/new-product noise - different from both of
  # the above. none (default, disabled) | google_custom_search (needs
  # GOOGLE_CUSTOM_SEARCH_API_KEY/ENGINE_ID in .env, free for 100
  # queries/day - see web_search/google_custom_search.py)
  backend: none
  results_per_query: 10

stolen_registries:
  enabled:
    - lenstag
    - stolen_camera_finder              # automated serial-number search
    - stolen_camera_finder_dust_pattern  # always manual-check (photo upload), see stolen_registries/manual.py

alerting:
  telegram:
    enabled: true   # requires TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in .env
