# Copy to config/settings.yaml. This file contains no personal data and is
# safe to commit/share - the actual stolen item lives in watched_items.yaml.

db_path: data/stolen_gear_watch.db
log_level: INFO       # DEBUG | INFO | WARNING | ERROR
log_format: json       # json | text

# Minimum fuzzy text-match score (0-1) before a listing counts as a text
# match. Serial-number matches always count regardless of this threshold.
match_confidence_threshold: 0.6

# Sent as part of the User-Agent on every request, and used as the
# contact point site operators can reach if there's an issue - good
# scraping citizenship. Falls back to SCRAPER_CONTACT_EMAIL in .env if unset.
scraper_contact_email: null

scrapers:
  willhaben:
    enabled: false   # robots.txt confirmed disallows this - see scrapers/willhaben.py docstring
    rate_limit_seconds: 5
    max_pages: 3
    # respect_robots_txt defaults to true and isn't set here on purpose - the
    # shipped example always honors robots.txt. If you've made an informed,
    # personal decision to scrape Willhaben anyway (their robots.txt
    # explicitly says not to - this is on you, not something this project
    # endorses), set both of these in your own config/settings.yaml instead:
    #   enabled: true
    #   respect_robots_txt: false
  kleinanzeigen:
    enabled: true
    rate_limit_seconds: 5
    max_pages: 3
  limundo:
    enabled: false   # experimental - see scrapers/limundo.py docstring
    rate_limit_seconds: 5
    max_pages: 3
  kupujemprodajem:
    enabled: true
    rate_limit_seconds: 5
    max_pages: 3

reverse_image:
  # manual (default, no API key needed) | google_vision | tineye
  backend: manual
  min_confidence: 0.75

stolen_registries:
  enabled:
    - lenstag
    - stolen_camera_finder   # always manual-check, see stolen_registries/manual.py

alerting:
  telegram:
    enabled: true   # requires TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID in .env
