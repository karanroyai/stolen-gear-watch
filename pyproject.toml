[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stolen-gear-watch"
version = "0.1.0"
description = "Watch marketplaces and stolen-gear registries for a serialized item you've reported stolen, starting with cameras."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Karan Roy" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Reverse image search backends - only needed if you enable them in settings.yaml
google-vision = ["google-cloud-vision>=3.7"]
tineye = ["pytineye>=2.1"]
# Playwright is deliberately NOT a base dependency. Add it only if/when a
# specific scraper adapter needs JS rendering that plain requests can't handle.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "responses>=0.25",
]

[project.scripts]
stolen-gear-watch = "stolen_gear_watch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except): deliberately used at adapter/pipeline boundaries so
# one bad site or backend can't crash a whole scheduled run - see pipeline.py.
ignore = ["BLE001"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented pattern is `= typer.Option(...)` in the signature itself.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
